ci:
  skip:
    - eslint
    - oxfmt
    - go-fmt
    - go-vet
    - go-tidy
    - golangci-lint-full
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args:
          - --fix=all
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: 1fb54d06ff80b555a6a428d9b12ff0796e67d923 # v0.74.0
    hooks:
      - id: oxfmt
        types_or: [javascript, jsx, ts, tsx, markdown, mdx]
  - repo: https://github.com/golangci/golines
    rev: v0.16.0
    hooks:
      - id: golines
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint-full
  - repo: local
    hooks:
      - id: eslint
        name: lint typescript
        entry: pnpm eslint
        language: system
        pass_filenames: true
        types_or:
          - ts
          - tsx
      - id: go-fmt
        name: go fmt
        entry: go fmt
        language: system
        pass_filenames: false
        types:
          - go
      - id: go-vet
        name: go vet
        entry: go vet
        language: system
        pass_filenames: false
        always_run: true
      - id: go-tidy
        name: tidy go mod
        entry: go mod tidy
        language: system
        pass_filenames: false
        types_or:
          - go-sum
          - go-mod
